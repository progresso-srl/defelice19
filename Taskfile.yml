# https://taskfile.dev

version: '3'
schema: 'https://taskfile.dev/schema/project_v3.json'

# Il database si sceglie da riga di comando:  task update DB_NAME=defelice19-test
vars:
  DB_NAME: '{{.DB_NAME | default "odoo-19"}}'
  PSQL: C:\PROGRA~1\PostgreSQL\16\bin\psql.exe

env:
  ODOO_BIN: C:/Users/Francesco/Developer/Progresso/odoo/odoo-bin
  ODOO_CONF: C:/Users/Francesco/Developer/Progresso/odoo19.conf
  MODULES: account_invoice_sequential_dates,ey_base,ey_contabilita_navi,ey_corsi,ey_pratiche,ey_report

tasks:
  psql:
    desc: Apre psql sul database
    interactive: true
    cmds:
      - cmd /c "set PGPASSWORD=odoo&& {{.PSQL}} -U odoo -d {{.DB_NAME}}"

  admin:
    desc: Imposta login e password admin/admin (solo database di sviluppo)
    interactive: true
    cmds:
      # La password passa dall'ORM, che la cifra: con un UPDATE su res_users
      # finirebbe in chiaro nel database.
      - >-
        cmd /c "echo env['res.users'].browse(2).write({'login': 'admin', 'password': 'admin'}); env.cr.commit()
        | python {{.ODOO_BIN}} shell -c {{.ODOO_CONF}} -d {{.DB_NAME}} --no-http"

  install:
    desc: Installa i moduli del repo
    cmds:
      - cmd /c "python {{.ODOO_BIN}} -c {{.ODOO_CONF}} -d {{.DB_NAME}} -i {{.MODULES}} --stop-after-init"

  update:
    desc: Aggiorna i moduli del repo
    cmds:
      - cmd /c "python {{.ODOO_BIN}} -c {{.ODOO_CONF}} -d {{.DB_NAME}} -u {{.MODULES}} --stop-after-init"

  update_all:
    desc: Aggiorna tutti i moduli di Odoo
    cmds:
      - cmd /c "python {{.ODOO_BIN}} -c {{.ODOO_CONF}} -d {{.DB_NAME}} -u all --stop-after-init"
